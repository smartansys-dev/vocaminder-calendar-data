name: Tamil calendar maintenance
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      publish_experimental:
        description: 'Publish experimental data (accuracy not independently established)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tamil-calendar-maintenance
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: node scripts/validate_accuracy.js
      - run: node scripts/generate_calendar.js --from 2025 --to 2050
      - run: python scripts/validate_candidates.py
      - run: python scripts/validate_calendar.py
      - name: Check future coverage
        run: python scripts/check_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-candidates
          path: candidates/
          retention-days: 7
  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_experimental && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: calendar-candidates
          path: candidates/
      - run: python scripts/validate_candidates.py
      - run: python scripts/publish_calendar.py --approve-experimental
      - name: Commit approved data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar/calendar_index.json calendar/tamil_calendar_*_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish experimental Tamil calendar data'
          git push origin HEAD:main
